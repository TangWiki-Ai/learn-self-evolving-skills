[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "learn-self-evolving-skills"
version = "0.1.0"
description = "Build and evaluate self-evolving agent skills."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
testset = [
  "scikit-learn>=1.7,<2",
]

[project.scripts]
ses = "ses.cli.app:main"

[dependency-groups]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.uv.build-backend]
module-name = "ses"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests", "course"]
markers = [
  "live: explicit paid Claude Code and Provider integration tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src,$MYPY_CONFIG_FILE_DIR/scripts"

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/phase0_check.py" = ["RUF001"]
