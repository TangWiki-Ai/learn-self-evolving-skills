<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Skill 自进化 Pipeline</title>
  <desc id="desc">开发者从十五个可执行客服用例的基线证据中选择并归因失败，最小修改 Skill，再依次经过目标回放和完整基线回归。目标回放未通过时不会运行完整回归；两道检查都通过后，开发者再决定发布、发布并演练回滚，或暂缓。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67645f"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: Georgia, "Songti SC", "STSong", serif; }
      .ink { fill: #22211e; }
      .muted { fill: #67645f; }
      .brand { fill: #a94b37; }
      .node { fill: #ffffff; stroke: #d9d6ce; stroke-width: 1.5; }
      .node-active { fill: #fffaf7; stroke: #c45c43; stroke-width: 1.8; }
      .connector { fill: none; stroke: #67645f; stroke-width: 2.2; marker-end: url(#arrow); }
      .label { font-size: 16px; font-weight: 700; letter-spacing: .04em; }
      .node-title { font-size: 23px; font-weight: 750; }
      .node-copy { font-size: 15.5px; }
    </style>
  </defs>

  <rect width="1200" height="940" rx="18" fill="#f7f6f1"/>
  <rect x="1" y="1" width="1198" height="938" rx="17" fill="none" stroke="#e1ded6" stroke-width="2"/>

  <text x="40" y="52" class="sans brand label">证据驱动 · 开发者在环</text>
  <text x="40" y="105" class="serif ink" font-size="45" font-weight="700">一次 Skill 修改如何经过验证</text>
  <text x="40" y="143" class="sans muted" font-size="20">系统提供运行证据和回归检查；你负责归因、修改与版本决定。</text>

  <rect x="40" y="178" width="1120" height="56" rx="10" fill="#efede6"/>
  <circle cx="68" cy="206" r="6" fill="#c45c43"/>
  <text x="88" y="213" class="sans ink" font-size="18" font-weight="650">输入：15 个可执行客服用例（固定 case 集） · 当前 Skill · Provider 与模型锁</text>

  <!-- Connectors are drawn before nodes so they stay behind labels. -->
  <path class="connector" d="M 185 352 H 210"/>
  <path class="connector" d="M 355 352 H 380"/>
  <path class="connector" d="M 525 352 H 550"/>
  <path class="connector" d="M 695 352 H 720"/>
  <path class="connector" d="M 865 352 H 920"/>
  <path class="connector" d="M 1020 432 V 500"/>
  <path class="connector" d="M 925 565 H 890"/>
  <path class="connector" d="M 650 565 H 620"/>
  <path class="connector" d="M 390 565 H 340"/>

  <!-- No attributable Skill target branch. -->
  <path class="connector" d="M 452 425 V 458 H 350 V 720 H 330"/>

  <!-- Both failed gates converge on the same reject state. -->
  <path class="connector" d="M 1120 352 H 1168 V 720 H 1160"/>
  <path class="connector" d="M 770 645 V 720 H 900"/>
  <path class="connector" d="M 900 760 C 805 830, 650 830, 622 440"/>

  <!-- Stage 1 -->
  <rect x="40" y="280" width="145" height="145" rx="12" class="node"/>
  <text x="58" y="309" class="sans brand label">01</text>
  <text x="58" y="349" class="sans ink node-title">运行基线</text>
  <text x="58" y="382" class="sans muted node-copy">
    <tspan x="58" dy="0">在 live 路径运行</tspan>
    <tspan x="58" dy="24">15-case 基线</tspan>
  </text>

  <!-- Stage 2 -->
  <rect x="210" y="280" width="145" height="145" rx="12" class="node"/>
  <text x="228" y="309" class="sans brand label">02</text>
  <text x="228" y="349" class="sans ink node-title">收集证据</text>
  <text x="228" y="382" class="sans muted node-copy">
    <tspan x="228" dy="0">工具调用 · StateDiff</tspan>
    <tspan x="228" dy="24">Trace · Judge</tspan>
  </text>

  <!-- Stage 3 -->
  <rect x="380" y="280" width="145" height="145" rx="12" class="node-active"/>
  <text x="398" y="309" class="sans brand label">03</text>
  <text x="398" y="349" class="sans ink node-title">筛选并归因</text>
  <text x="398" y="382" class="sans muted node-copy">
    <tspan x="398" dy="0">环境 / 用例 / Skill</tspan>
    <tspan x="398" dy="24">定位具体文本</tspan>
  </text>

  <!-- Stage 4 -->
  <rect x="550" y="280" width="145" height="145" rx="12" class="node-active"/>
  <text x="568" y="309" class="sans brand label">04</text>
  <text x="568" y="349" class="sans ink node-title">最小修改</text>
  <text x="568" y="382" class="sans muted node-copy">
    <tspan x="568" dy="0">保存候选快照</tspan>
    <tspan x="568" dy="24">验证运行时变化</tspan>
  </text>

  <!-- Stage 5 -->
  <rect x="720" y="280" width="145" height="145" rx="12" class="node"/>
  <text x="738" y="309" class="sans brand label">05</text>
  <text x="738" y="349" class="sans ink node-title">目标回放</text>
  <text x="738" y="382" class="sans muted node-copy">
    <tspan x="738" dy="0">只回放已选中且</tspan>
    <tspan x="738" dy="24">归因到 Skill 的目标</tspan>
  </text>

  <!-- Gate 1 -->
  <path d="M 1020 272 L 1120 352 L 1020 432 L 920 352 Z" fill="#fff4ef" stroke="#c45c43" stroke-width="2"/>
  <text x="1020" y="342" text-anchor="middle" class="sans ink" font-size="20" font-weight="750">门 1 · 目标回放</text>
  <text x="1020" y="378" text-anchor="middle" class="sans brand" font-size="17" font-weight="750">目标全部通过？</text>
  <text x="1020" y="471" text-anchor="middle" class="sans brand" font-size="15" font-weight="700">通过后才运行完整回归</text>

  <!-- Stage 6: only reached after Gate 1 passes. -->
  <rect x="925" y="500" width="190" height="130" rx="12" class="node"/>
  <text x="943" y="529" class="sans brand label">06</text>
  <text x="943" y="568" class="sans ink node-title">全量回归</text>
  <text x="943" y="600" class="sans muted node-copy">重跑同一组 15-case 基线</text>

  <!-- Gate 2 -->
  <path d="M 770 485 L 890 565 L 770 645 L 650 565 Z" fill="#fff4ef" stroke="#c45c43" stroke-width="2"/>
  <text x="770" y="525" text-anchor="middle" class="sans ink" font-size="19" font-weight="750">门 2 · 最终检查</text>
  <text x="770" y="550" text-anchor="middle" class="sans muted" font-size="14">候选有运行时变化</text>
  <text x="770" y="575" text-anchor="middle" class="sans muted" font-size="14">目标仍通过 · 集合完整</text>
  <text x="770" y="601" text-anchor="middle" class="sans brand" font-size="16" font-weight="750">pass→fail = 0？</text>

  <!-- Version decision: Gate acceptance does not auto-publish. -->
  <rect x="390" y="500" width="230" height="130" rx="12" fill="#eef6f0" stroke="#2f7451" stroke-width="1.7"/>
  <text x="408" y="529" class="sans" fill="#2f7451" font-size="16" font-weight="750">07 · 开发者决定</text>
  <text x="408" y="568" class="sans ink node-title">版本决定</text>
  <text x="408" y="598" class="sans muted" font-size="14.5">发布 · 暂缓 · 发布并演练</text>
  <text x="408" y="619" class="sans muted" font-size="14.5">本地回滚 v1 → v0 → v1</text>

  <rect x="100" y="500" width="240" height="130" rx="12" class="node"/>
  <text x="120" y="537" class="sans ink node-title">记录结果</text>
  <text x="120" y="570" class="sans muted node-copy">版本时间线</text>
  <text x="120" y="596" class="sans muted node-copy">事实文件与证据索引</text>

  <!-- Alternative terminal states. -->
  <text x="360" y="487" class="sans muted" font-size="14" font-weight="700">没有可归因的 Skill 目标</text>
  <rect x="100" y="680" width="230" height="80" rx="11" fill="#efede6"/>
  <text x="215" y="713" text-anchor="middle" class="sans ink" font-size="20" font-weight="750">记录现状</text>
  <text x="215" y="741" text-anchor="middle" class="sans muted" font-size="15">不制造失败，不强行修改</text>

  <text x="1130" y="338" class="sans brand" font-size="15" font-weight="700">未通过</text>
  <text x="785" y="680" class="sans brand" font-size="15" font-weight="700">未通过</text>
  <rect x="900" y="680" width="260" height="80" rx="11" fill="#ffffff" stroke="#d9d6ce" stroke-width="1.5"/>
  <text x="1030" y="713" text-anchor="middle" class="sans ink" font-size="20" font-weight="750">Gate 拒绝</text>
  <text x="1030" y="741" text-anchor="middle" class="sans muted" font-size="15">继续收窄修改，或暂缓</text>

  <!-- Evidence rail -->
  <rect x="40" y="850" width="1120" height="56" rx="10" fill="#22211e"/>
  <text x="64" y="885" class="sans" fill="#ffffff" font-size="16" font-weight="700">每一步写入 .ses/</text>
  <text x="220" y="885" class="sans" fill="#d8d5ce" font-size="15">运行记录</text>
  <circle cx="302" cy="879" r="3" fill="#c45c43"/>
  <text x="320" y="885" class="sans" fill="#d8d5ce" font-size="15">候选快照</text>
  <circle cx="414" cy="879" r="3" fill="#c45c43"/>
  <text x="432" y="885" class="sans" fill="#d8d5ce" font-size="15">回归检查结果</text>
  <circle cx="570" cy="879" r="3" fill="#c45c43"/>
  <text x="588" y="885" class="sans" fill="#d8d5ce" font-size="15">版本时间线</text>
  <circle cx="708" cy="879" r="3" fill="#c45c43"/>
  <text x="726" y="885" class="sans" fill="#d8d5ce" font-size="15">evidence-facts.json</text>
  <circle cx="902" cy="879" r="3" fill="#c45c43"/>
  <text x="920" y="885" class="sans" fill="#d8d5ce" font-size="15">evidence-index.json</text>
</svg>
